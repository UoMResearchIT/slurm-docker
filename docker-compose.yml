version: "3.8"
services:
  slurm:
    hostname: slurm
    build:
      context: .
    volumes:
      - clusterstate:/state
      - clusterscratch:/scratch
      - ./bin/docker-entrypoint.sh:/etc/slurm/docker-entrypoint.sh
      - ./etc/slurm.conf:/etc/slurm/slurm.conf
      - clusterhome:/home
    ports:
      - "127.0.0.1:2022:22"

volumes:
  clusterstate:
  clusterscratch:
  clusterhome:
