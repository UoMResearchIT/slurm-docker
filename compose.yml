services:
  slurm:
    hostname: slurm
    build:
      context: .
    volumes:
      - clusterstate:/state
      - clusterscratch:/scratch
      - ./bin/docker-entrypoint.sh:/etc/slurm-llnl/docker-entrypoint.sh
      - ./etc/slurm.conf:/etc/slurm-llnl/slurm.conf
      - clusterhome:/home
    ports:
      - "2022:22"
    restart: unless-stopped

volumes:
  clusterstate:
  clusterscratch:
  clusterhome:
